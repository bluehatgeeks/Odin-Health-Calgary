<body>
<script>
/* ── Odin Health Labs — Component Loader (inline, same as the homepage) ── */
(function () {
  var CDN = 'https://cdn.jsdelivr.net/gh/bluehatgeeks/Odin-Health-Calgary@master';
  function execScripts(container) {
    container.querySelectorAll('script').forEach(function (oldScript) {
      var newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(function (attr) { newScript.setAttribute(attr.name, attr.value); });
      newScript.textContent = oldScript.textContent;
      oldScript.parentNode.replaceChild(newScript, oldScript);
    });
  }
  var navRoot = document.createElement('div');
  navRoot.id = 'odin-nav-root';
  document.body.insertBefore(navRoot, document.body.firstChild);
  fetch('https://raw.githubusercontent.com/bluehatgeeks/Odin-Health-Calgary/master/odinnav.html', { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (html) { navRoot.innerHTML = html; execScripts(navRoot); })
    .catch(function (err) { console.error('[odin-loader] Nav fetch failed:', err); });
  document.addEventListener('DOMContentLoaded', function () {
    var footerRoot = document.createElement('div');
    footerRoot.id = 'odin-footer-root';
    document.body.appendChild(footerRoot);
    fetch('https://raw.githubusercontent.com/bluehatgeeks/Odin-Health-Calgary/master/odinfooter.html?v=2', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (html) { footerRoot.innerHTML = html; execScripts(footerRoot); })
      .catch(function (err) { console.error('[odin-loader] Footer fetch failed:', err); });
  });
})();
</script>

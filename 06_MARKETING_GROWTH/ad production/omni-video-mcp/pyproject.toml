[project]
name = "omni-video-mcp"
version = "0.1.0"
description = "MCP server for Google Gemini Omni Flash — video ad generation and conversational editing"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "google-genai>=1.30.0",
]

[project.scripts]
omni-video-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]

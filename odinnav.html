<script>
/* ── Mobile nav toggle ── */
(function () {
  var toggle = document.querySelector('.nav-toggle');
  var nav = document.getElementById('header-nav');
  var overlay = document.getElementById('nav-overlay');
  if (!toggle || !nav || !overlay) return;
  function openNav() {
    toggle.setAttribute('aria-expanded', 'true');
    nav.classList.add('is-open');
    overlay.classList.add('is-visible');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeNav() {
    toggle.setAttribute('aria-expanded', 'false');
    nav.classList.remove('is-open');
    overlay.classList.remove('is-visible');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  toggle.addEventListener('click', function () {
    if (toggle.getAttribute('aria-expanded') === 'true') closeNav();
    else openNav();
  });
  overlay.addEventListener('click', closeNav);
  nav.querySelectorAll('a:not(.mega-mobile-item)').forEach(function (a) { a.addEventListener('click', closeNav); });
  nav.querySelectorAll('.mega-mobile-item').forEach(function (a) { a.addEventListener('click', closeNav); });
})();

/* ── Phone obfuscation ── */
(function () {
  var a = document.querySelector('.nav-contact');
  if (!a || !a.dataset.c) return;
  var decoded = atob(a.dataset.c);
  var num = decoded.replace('tel:+1', '').replace(/(\d{3})(\d{3})(\d{4})/, '$1.$2.$3');
  a.textContent = 'Call Us: ' + num;
  a.addEventListener('click', function (e) {
    e.preventDefault();
    window.location.href = decoded;
  });
})();

/* ── Mega menu (desktop hover + click, mobile accordion) ── */
(function () {
  var trigger = document.getElementById('mega-trigger');
  var menu    = document.getElementById('mega-menu');
  var mobileSub = document.getElementById('mega-mobile-sub');
  if (!trigger || !menu) return;

  var leaveTimer = null;

  function openMega() {
    trigger.setAttribute('aria-expanded', 'true');
    menu.setAttribute('aria-hidden', 'false');
    menu.classList.add('is-open');
  }
  function closeMega() {
    trigger.setAttribute('aria-expanded', 'false');
    menu.setAttribute('aria-hidden', 'true');
    menu.classList.remove('is-open');
  }
  function isMobile() { return window.innerWidth <= 900; }

  /* Desktop: hover intent with small delay to allow cursor travel */
  trigger.addEventListener('mouseenter', function () {
    if (isMobile()) return;
    clearTimeout(leaveTimer);
    openMega();
  });
  menu.addEventListener('mouseenter', function () {
    clearTimeout(leaveTimer);
  });
  trigger.addEventListener('mouseleave', function () {
    if (isMobile()) return;
    leaveTimer = setTimeout(closeMega, 180);
  });
  menu.addEventListener('mouseleave', function () {
    leaveTimer = setTimeout(closeMega, 180);
  });

  /* Click: toggle (handles both touch/mobile accordion and desktop click) */
  trigger.addEventListener('click', function (e) {
    e.stopPropagation();
    if (isMobile()) {
      /* Mobile: accordion toggle */
      var isOpen = mobileSub && mobileSub.getAttribute('aria-hidden') === 'false';
      if (mobileSub) {
        mobileSub.setAttribute('aria-hidden', isOpen ? 'true' : 'false');
        mobileSub.classList.toggle('is-open', !isOpen);
      }
      trigger.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
    } else {
      if (trigger.getAttribute('aria-expanded') === 'true') closeMega();
      else openMega();
    }
  });

  /* Close on outside click / Escape */
  document.addEventListener('click', function (e) {
    if (!trigger.contains(e.target) && !menu.contains(e.target)) closeMega();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeMega(); trigger.focus(); }
  });
})();
</script>
